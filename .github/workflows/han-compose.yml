name: han-compose

# Takes the newest han-compose package: the lockfile moves once the checks pass with it, and the site is
# deployed. han-compose starts this on each package it publishes; the hourly run covers a start that did
# not arrive.
on:
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'

permissions: {}

concurrency:
  group: han-compose
  cancel-in-progress: false

jobs:
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      moved: ${{ steps.update.outputs.moved }}
      head: ${{ steps.update.outputs.head }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - id: update
        run: |
          bun update han-compose
          git diff --quiet -- bun.lock || echo 'moved=true' >> "$GITHUB_OUTPUT"
          echo "head=$(jq -r '.gitHead[:12]' node_modules/han-compose/package.json)" >> "$GITHUB_OUTPUT"
      - if: steps.update.outputs.moved
        run: bun run test && bun run check && bun run build
      - if: steps.update.outputs.moved
        uses: actions/upload-artifact@v4
        with:
          name: lock
          path: bun.lock
  # Nothing is installed here: this job alone can write.
  take:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - if: needs.check.outputs.moved
        uses: actions/download-artifact@v4
        with:
          name: lock
          path: lock
      - if: needs.check.outputs.moved
        env:
          HEAD: ${{ needs.check.outputs.head }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mv lock/bun.lock bun.lock
          git commit --quiet -m "chore(composer): han-compose $HEAD" -- bun.lock
          git pull --quiet --rebase origin main
          git push --quiet origin HEAD:main
      # A push made with this job's token starts no workflow. A commit with no Deploy run is deployed
      # whether this run made it or an earlier one that stopped here.
      - run: |
          sha=$(git rev-parse HEAD)
          [ "$(gh run list --workflow deploy.yml --commit "$sha" --json databaseId --jq length)" != 0 ] \
            || gh workflow run deploy.yml --ref main
