name: Warm glyphs

# Draws the glyphs no earlier run settled, once a deploy has finished. A newer deploy takes over from a run still going.
on:
  workflow_run:
    workflows: [Deploy]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: warm-glyphs
  cancel-in-progress: true

jobs:
  warm:
    name: Warm glyphs
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      # The key names every address wanted now, each carrying its export and composer.
      - id: plan
        run: bun scripts/warm-glyphs.ts plan .warm-glyphs
      # The same key means a completed run settled all of them. An earlier list spares the addresses it holds.
      - id: settled
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .warm-glyphs/settled.json
          key: ${{ steps.plan.outputs.key }}
          restore-keys: warm-glyphs-v1-
      - id: warm
        if: steps.settled.outputs.cache-hit != 'true'
        run: bun scripts/warm-glyphs.ts warm https://rare.glyphatlas.org .warm-glyphs
      # Reached only when the run before it completed: a failed or cancelled one keeps no key.
      - if: steps.settled.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .warm-glyphs/settled.json
          key: ${{ steps.plan.outputs.key }}
