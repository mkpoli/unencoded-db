<!doctype html>
<html lang="%lang%" prefix="og: https://ogp.me/ns#" data-theme="%theme%" data-tile-size="%tile%">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      // A deploy removes the previous build's script files. A page that asks for one reloads once to pick up the current build.
      {
        const stale = /dynamically imported module|Importing a module script failed/i
        const reload = () => {
          try {
            if (Date.now() - Number(sessionStorage.getItem('stale-build-reload')) < 30_000) return false
            sessionStorage.setItem('stale-build-reload', String(Date.now()))
          } catch {
            return false
          }
          location.reload()
          return true
        }
        addEventListener('vite:preloadError', (event) => {
          if (reload()) event.preventDefault()
        })
        addEventListener('unhandledrejection', (event) => {
          if (stale.test(String(event.reason?.message))) reload()
        })
      }
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
